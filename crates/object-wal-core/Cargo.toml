[package]
name = "object-wal-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "object_wal_core"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.92"
aws-config = "1.11.0"
aws-sdk-s3 = "1.143.0"
aws-smithy-runtime-api = { version = "1.15.0", features = ["http-1x"] }
aws-smithy-types = { version = "1.6.2", features = ["http-body-1-x"] }
bytes = "1.12.1"
chrono = "0.4.45"
futures = "0.3.34"
http-body = "1.1.0"
http-body-util = "0.1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full", "tracing"] }
